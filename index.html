<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <title>Важен въпрос</title>
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #ffe6e6;
    }

    .container {
      text-align: center;
    }

    h1 {
      margin-bottom: 40px;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
    }

    #da {
      background-color: #4CAF50;
      color: white;
    }

    #ne {
      background-color: #f44336;
      color: white;
      position: absolute;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Обичаш ли Мишко? 💖</h1>
    <button id="da" onclick="daClicked()">Да</button>
    <button id="ne">Не</button>
  </div>

  <script>
    const neButton = document.getElementById("ne");

    neButton.addEventListener("mouseover", () => {
      const x = Math.random() * (window.innerWidth - neButton.offsetWidth);
      const y = Math.random() * (window.innerHeight - neButton.offsetHeight);
      neButton.style.left = x + "px";
      neButton.style.top = y + "px";
    });

    function daClicked() {
      document.body.innerHTML = "<h1>Хихи 💕🥰</h1><p>Знаех си!</p>";
    }
  </script>

</body>
</html>
